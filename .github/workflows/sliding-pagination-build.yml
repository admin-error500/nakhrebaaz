name: Validate Sliding Collections and Pagination
on:
  push:
    branches: [feature/sliding-home-lazy-pagination-account]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DATABASE_URL: mongodb://127.0.0.1:27017/nakhrebaaz?replicaSet=rs0
      SESSION_SECRET: local-ci-only-demo-secret-32-character-minimum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: Next production build
        run: npm run build
